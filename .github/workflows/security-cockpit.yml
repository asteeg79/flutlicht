name: Security-Cockpit

# Security-Agent, Pilot (security/plan.md): Das Issue „Security-Cockpit“ (Label
# security-cockpit) zeigt den Stand der Scans, offene Update-PRs, Renovate-Freigaben und
# akzeptierte Risiken. Ein Häkchen dort führt die Aktion aus: mergen, freigeben, jetzt
# erstellen, Scan starten. Jede Aktion wird vorher gegen den aktuellen Stand geprüft
# (.github/scripts/security-cockpit.cjs).
# Mit der Cockpit-App (Variable COCKPIT_APP_CLIENT_ID, Secret COCKPIT_APP_PRIVATE_KEY)
# kann das Cockpit auch PRs mergen, die Workflows ändern, und der Merge startet die CI auf
# main. Ohne die App nimmt es das GITHUB_TOKEN und bietet solche PRs nicht zum Mergen an.
on:
  workflow_run:
    workflows: [Security-Tagesabgleich, Security-Wochenscan]
    types: [completed]
    branches: [main]
  issues:
    types: [edited]
  workflow_dispatch:
  # Probelauf bei Änderungen am Cockpit selbst: nur lesen, Ergebnis in der Zusammenfassung.
  pull_request:
    paths:
      - .github/workflows/security-cockpit.yml
      - .github/scripts/security-cockpit.cjs

concurrency:
  group: security-cockpit
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  cockpit:
    if: >-
      github.event_name != 'pull_request' &&
      (github.event_name != 'issues' ||
       (contains(github.event.issue.labels.*.name, 'security-cockpit') &&
        github.event.sender.id == fromJSON(github.repository_owner_id)))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # PRs mergen
      pull-requests: write
      issues: write
      checks: read
      actions: write # Scans starten
    env:
      COCKPIT_APP_CLIENT_ID: ${{ vars.COCKPIT_APP_CLIENT_ID }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - id: app
        if: env.COCKPIT_APP_CLIENT_ID != ''
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ env.COCKPIT_APP_CLIENT_ID }}
          private-key: ${{ secrets.COCKPIT_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write
          permission-checks: read
          permission-actions: write
          permission-workflows: write
      - name: Häkchen ausführen und Cockpit neu schreiben
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          COCKPIT_MIT_APP: ${{ steps.app.outputs.token != '' }}
        with:
          github-token: ${{ steps.app.outputs.token || github.token }}
          script: |
            const run = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/security-cockpit.cjs`);
            await run({ github, context, core });

  probe:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      issues: read
      checks: read
      actions: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Cockpit anzeigen (Probelauf)
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const run = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/security-cockpit.cjs`);
            await run({ github, context, core });
