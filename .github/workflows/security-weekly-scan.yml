name: Security-Wochenscan

# Security-Agent, Phase 2 (Pilot): wöchentlicher Vollscan.
# - Semgrep über das ganze Repo (nur Bericht), gitleaks über die ganze Historie.
# - ZAP Baseline (passiv) gegen die Live-App.
# - Ein Issue „Security-Wochenbericht“ mit Label security-report fasst zusammen;
#   der Bericht der Vorwoche wird dabei geschlossen.
# Montags 05:07 UTC (krumme Minute, GitHub-Schedules sind best effort).
on:
  schedule:
    - cron: "7 5 * * 1"
  workflow_dispatch:

concurrency:
  group: security-weekly
  cancel-in-progress: false

permissions:
  contents: read

env:
  GITLEAKS_VERSION: "8.30.1"
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
  SEMGREP_VERSION: "1.182.0"
  LIVE_URL: https://flutlicht.a-tec.dev

jobs:
  code:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      semgrep: ${{ steps.semgrep.outputs.summary }}
      semgrep_findings: ${{ steps.semgrep.outputs.findings }}
      gitleaks: ${{ steps.gitleaks.outputs.count }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: gitleaks (ganze Historie)
        id: gitleaks
        run: |
          curl -sSfL --proto '=https' --tlsv1.2 -o gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tgz" | sha256sum -c -
          tar xzf gitleaks.tgz gitleaks && rm gitleaks.tgz
          ./gitleaks git . --no-banner --redact --exit-code 0 -f json -r gitleaks.json
          echo "count=$(jq length gitleaks.json)" >> "$GITHUB_OUTPUT"
      - name: Semgrep (ganzes Repo)
        id: semgrep
        run: |
          pipx install "semgrep==${SEMGREP_VERSION}"
          semgrep scan --config p/default --metrics=off --disable-version-check \
            --exclude raw --exclude data --exclude reuse --exclude app/public \
            --json -o semgrep.json || true
          summary=$(jq -r '[.results[].extra.severity] | group_by(.) | map("\(.[0]): \(length)") | join(", ") | if . == "" then "keine" else . end' semgrep.json)
          echo "summary=$summary" >> "$GITHUB_OUTPUT"
          # Fundliste für das Issue, damit sich jeder Fund ohne Artefakt einordnen lässt.
          delim="EOF_$(openssl rand -hex 8)"
          {
            echo "findings<<$delim"
            jq -r '.results | sort_by(.extra.severity, .path, .start.line) | .[:50][] | "| \(.extra.severity) | `\(.check_id)` | `\(.path):\(.start.line)` |"' semgrep.json
            echo "$delim"
          } >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: code-scans
          path: |
            gitleaks.json
            semgrep.json
          retention-days: 30

  live:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      zap: ${{ steps.summary.outputs.zap }}
      zap_alerts: ${{ steps.summary.outputs.alerts }}
      status: ${{ steps.reach.outputs.status }}
    steps:
      # Antwortet die Startseite dem Runner nicht, sieht ZAP nur die Sperrseite
      # (am 03.11.2026: HTTP 403 von Cloudflare). Der Bericht sagt das dann dazu.
      - name: Erreichbarkeit der Startseite
        id: reach
        run: |
          status=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 \
            -A "Mozilla/5.0 (X11; Linux x86_64; rv:128.0) Gecko/20100101 Firefox/128.0" "$LIVE_URL") || status=000
          echo "status=$status" >> "$GITHUB_OUTPUT"
      - uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        with:
          target: ${{ env.LIVE_URL }}
          allow_issue_writing: false
          fail_action: false
          artifact_name: zap-baseline
      - name: Zusammenfassung
        id: summary
        if: always()
        run: |
          if [ -f report_json.json ]; then
            zap=$(jq -r '[.site[].alerts[].riskdesc | split(" ")[0]] | group_by(.) | map("\(.[0]): \(length)") | join(", ") | if . == "" then "keine" else . end' report_json.json)
            delim="EOF_$(openssl rand -hex 8)"
            {
              echo "alerts<<$delim"
              jq -r '.site[].alerts[] | "| \(.riskdesc | split(" ")[0]) | \(.alert) [\(.pluginid)] | \(.count) |"' report_json.json
              echo "$delim"
            } >> "$GITHUB_OUTPUT"
          else
            zap="kein Bericht"
          fi
          echo "zap=$zap" >> "$GITHUB_OUTPUT"

  report:
    needs: [code, live]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          SEMGREP: ${{ needs.code.outputs.semgrep || 'Lauf fehlgeschlagen' }}
          GITLEAKS: ${{ needs.code.outputs.gitleaks || 'Lauf fehlgeschlagen' }}
          ZAP: ${{ needs.live.outputs.zap || 'Lauf fehlgeschlagen' }}
          SEMGREP_FINDINGS: ${{ needs.code.outputs.semgrep_findings }}
          ZAP_ALERTS: ${{ needs.live.outputs.zap_alerts }}
          LIVE_STATUS: ${{ needs.live.outputs.status }}
        with:
          script: |
            const label = "security-report";
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const day = new Date().toISOString().slice(0, 10);
            const status = process.env.LIVE_STATUS;
            const reached = !status || /^[23]\d\d$/.test(status);
            const table = (head, rows) => (rows || "").trim() ? ["", head, "| --- | --- | --- |", rows.trim()] : [];
            const body = [
              `Security-Wochenscan vom ${day} ([Lauf](${runUrl}), Berichte als Artefakte).`,
              "",
              "| Prüfung | Ergebnis |",
              "| --- | --- |",
              `| gitleaks, ganze Historie | ${process.env.GITLEAKS} Funde |`,
              `| Semgrep p/default, ganzes Repo | ${process.env.SEMGREP} |`,
              `| ZAP Baseline ${process.env.LIVE_URL} | ${process.env.ZAP} |`,
              ...(reached ? [] : [
                "",
                `**Achtung:** Die Startseite antwortete dem Runner mit HTTP ${status}. ZAP hat dann vermutlich nur die Sperrseite gesehen, nicht die App.`,
              ]),
              ...table("**Semgrep** (höchstens 50)\n\n| Schwere | Regel | Stelle |", process.env.SEMGREP_FINDINGS),
              ...table("**ZAP**\n\n| Risiko | Hinweis | Treffer |", process.env.ZAP_ALERTS),
              "",
              "Pilot (Phase 2): jeden Fund als treffend oder Fehlalarm einordnen.",
            ].join("\n");
            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: label,
            });
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Security-Wochenbericht ${day}`,
              body,
              labels: [label],
            });
            for (const issue of open) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: "closed",
                state_reason: "completed",
              });
            }
