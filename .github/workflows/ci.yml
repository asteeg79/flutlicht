name: CI (Lint + Typecheck + Tests)

# Übernommen aus WM-Tipp .github/workflows/ci.yml, angepasst: paths-ignore für
# raw/ und data/, Node 24 (vitest 5 braucht ≥ 22.12).
#
# Qualitäts-Gate: prüft bei jedem Code-Push/PR Lint, Format, Typecheck aller
# Pakete und die Vitest-Suite. Keine Secrets nötig, keine Netzwerkabrufe.
# Reine Daten-/Doku-Commits lösen keinen Lauf aus → spart CI-Minuten.
on:
  push:
    branches: [main]
    paths-ignore:
      - "raw/**"
      - "data/**"
      - "docs/**"
      - "**.md"
  pull_request:
    paths-ignore:
      - "raw/**"
      - "data/**"
      - "docs/**"
      - "**.md"
  workflow_dispatch:

# Überholte Läufe auf demselben Ref abbrechen (CI darf canceln, anders als die
# Daten-Pipeline, die nie abgebrochen wird).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          check-latest: true
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint (ESLint)
        run: pnpm lint
      - name: Format-Check (Prettier)
        run: pnpm format:check
      - name: Typecheck (alle Pakete)
        run: pnpm -r typecheck
      - name: Unit-Tests (Vitest)
        run: pnpm test

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          check-latest: true
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Playwright-Browser
        # WebKit für die iPhone-Profile (Safari-Engine), Chromium für Android.
        run: pnpm --filter @fm/app exec playwright install --with-deps chromium webkit
      - name: E2E (Playwright, inkl. emulierter iPhones und Android-Geräte)
        run: pnpm --filter @fm/app test:e2e
      - name: Geräte-Screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: geraete-screenshots
          path: app/test-results/devices/
          retention-days: 14
          if-no-files-found: ignore

  scraper:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
      # Die Tests brauchen botasaurus nicht (wird erst im Transport importiert).
      - run: pip install pytest pillow
      - name: Scraper-Tests (pytest, ohne Netzwerk)
        working-directory: scraper
        run: python -m pytest -q
