name: CI (Lint + Typecheck + Tests)

# Übernommen aus WM-Tipp .github/workflows/ci.yml, angepasst: paths-ignore für
# raw/ und data/, Node 26 wie bei Vercel (vitest 5 braucht ≥ 22.12).
#
# Qualitäts-Gate: prüft bei jedem Code-Push/PR Lint, Format, Typecheck aller
# Pakete und die Vitest-Suite. Keine Secrets nötig, keine Netzwerkabrufe.
# Reine Daten-/Doku-Commits lösen keinen Lauf aus → spart CI-Minuten.
# E2E (e2e.yml) und Scraper-Tests (scraper.yml) laufen in eigenen Workflows nur,
# wenn sich ihre Dateien ändern; das spart die meisten Minuten.
on:
  push:
    branches: [main]
    paths-ignore:
      - "raw/**"
      - "data/**"
      - "docs/**"
      - "**.md"
  pull_request:
    paths-ignore:
      - "raw/**"
      - "data/**"
      - "docs/**"
      - "**.md"
  workflow_dispatch:

# Überholte Läufe auf demselben Ref abbrechen (CI darf canceln, anders als die
# Daten-Pipeline, die nie abgebrochen wird).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 26
          check-latest: true
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Lint (ESLint)
        run: pnpm lint
      - name: Format-Check (Prettier)
        run: pnpm format:check
      - name: Typecheck (alle Pakete)
        run: pnpm -r typecheck
      - name: Unit-Tests (Vitest)
        run: pnpm test
