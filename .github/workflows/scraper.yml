name: Scraper-Tests

# Aus ci.yml herausgelöst: pytest für den Scraper nur, wenn sich scraper/ ändert.
on:
  push:
    branches: [main]
    paths:
      - "scraper/**"
      - ".github/workflows/scraper.yml"
  pull_request:
    paths:
      - "scraper/**"
      - ".github/workflows/scraper.yml"
  workflow_dispatch:

concurrency:
  group: scraper-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  scraper:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.15" # wie auf dem Pi
      # Die Tests brauchen botasaurus nicht (wird erst im Transport importiert).
      # Feste Versionen mit Hashes, nur fertige Wheels: keine Setup-Skripte.
      - run: |
          pip install --only-binary :all: --require-hashes -r scraper/requirements-ci.txt
      - name: Scraper-Tests (pytest, ohne Netzwerk)
        working-directory: scraper
        run: python -m pytest -q
