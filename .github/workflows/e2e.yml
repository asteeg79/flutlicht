name: E2E (Playwright)

# Aus ci.yml herausgelöst, damit die Browser-Tests (etwa 4 Minuten) nur laufen, wenn sich
# App, Spielregeln oder Abhängigkeiten ändern, nicht bei Workflow-, Scraper- oder
# Doku-Änderungen (Security-Agent, Actions-Kontingent, 03.11.2026).
on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "core/**"
      - "scripts/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig.base.json"
      - ".github/workflows/e2e.yml"
  pull_request:
    paths:
      - "app/**"
      - "core/**"
      - "scripts/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig.base.json"
      - ".github/workflows/e2e.yml"
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 26
          check-latest: true
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Playwright-Browser
        # WebKit für die iPhone-Profile (Safari-Engine), Chromium für Android.
        working-directory: app
        run: ./node_modules/.bin/playwright install --with-deps chromium webkit
      - name: E2E (Playwright, inkl. emulierter iPhones und Android-Geräte)
        run: pnpm --filter @fm/app test:e2e
      - name: Geräte-Screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: geraete-screenshots
          path: app/test-results/devices/
          retention-days: 14
          if-no-files-found: ignore
