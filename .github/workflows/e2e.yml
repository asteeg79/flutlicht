name: E2E (Playwright)

# Aus ci.yml herausgelöst, damit die Browser-Tests (etwa 4 Minuten) nur laufen, wenn sich
# App, Spielregeln oder Abhängigkeiten ändern, nicht bei Workflow-, Scraper- oder
# Doku-Änderungen (Security-Agent, Actions-Kontingent, 03.11.2026).
on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "core/**"
      - "scripts/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig.base.json"
      - ".github/workflows/e2e.yml"
  pull_request:
    paths:
      - "app/**"
      - "core/**"
      - "scripts/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig.base.json"
      - ".github/workflows/e2e.yml"
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Version von @playwright/test aus dem Lockfile: Das Container-Image unten muss dazu
  # passen, sonst fehlen die Browser. So zieht es mit, wenn Renovate Playwright hebt.
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read # für „Schon im PR geprüft?“
    outputs:
      version: ${{ steps.version.outputs.version }}
      e2e: ${{ steps.pr.outputs.e2e }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          sparse-checkout: pnpm-lock.yaml
          sparse-checkout-cone-mode: false
      - id: version
        run: |
          version=$(grep -oE "^  '@playwright/test@[0-9]+\.[0-9]+\.[0-9]+'" pnpm-lock.yaml | head -1 | grep -oE "[0-9]+\.[0-9]+\.[0-9]+")
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      # Ein Push auf main aus einem gemergten PR wurde im PR schon per E2E geprüft; der
      # zweite Lauf entfällt (Actions-Minuten, Auswertung 11.11.2026). Direkte Pushes ohne
      # PR und alle PRs prüft E2E weiterhin. Im Zweifel (API nicht erreichbar) läuft E2E.
      - name: Schon im PR geprüft?
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
        run: |
          e2e=true
          if [ "$EVENT" = push ]; then
            n=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" \
              --jq '[.[] | select(.merged_at != null)] | length' 2>/dev/null || echo 0)
            if [ "${n:-0}" -gt 0 ]; then
              e2e=false
              echo "::notice::Commit stammt aus einem gemergten PR, E2E lief dort schon."
            fi
          fi
          echo "e2e=$e2e" >> "$GITHUB_OUTPUT"

  e2e:
    needs: playwright
    if: needs.playwright.outputs.e2e == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Offizielles Playwright-Image mit Chromium (Android-Profile), WebKit (iPhone-Profile)
    # und allen Systempaketen. Vorher holte `playwright install --with-deps` die Pakete per
    # apt; am 06.11.2026 hing das am Ubuntu-Spiegel der Runner, bis das Zeitlimit griff.
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.playwright.outputs.version }}-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 26
          check-latest: true
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: E2E (Playwright, inkl. emulierter iPhones und Android-Geräte)
        run: pnpm --filter @fm/app test:e2e
      - name: Geräte-Screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: geraete-screenshots
          path: app/test-results/devices/
          retention-days: 14
          if-no-files-found: ignore
