[project]
name = "fm-scraper"
version = "0.1.0"
description = "Heim-Rechner-Scraper für den Fußballmanager (Sofascore → raw/)"
requires-python = ">=3.11"
dependencies = ["botasaurus>=4.0", "pillow>=10"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["fm_scraper*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
