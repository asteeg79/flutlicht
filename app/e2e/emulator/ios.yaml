# Durchlauf im echten Mobile Safari des iOS-Simulators (docs/mobil-testen.md).
# Aufruf über `pnpm --filter @fm/app emulator:ios`;
# Screenshots in test-results/emulator/ios/ios/takeScreenshot/.
appId: com.apple.mobilesafari
env:
  BASE: http://localhost:3100
---
# Mit bestehender Sitzung landet /team direkt auf der Aufstellung, sonst auf /login.
- openLink: ${BASE}/team
- extendedWaitUntil:
    visible: "Passwort vergessen\\?|Fixiert in.*|Nächste fixiert in.*|Gewertet ab.*"
    timeout: 60000
- runFlow:
    when:
      visible: "Passwort vergessen?"
    commands:
      # Im Simulator geht Tastatureingabe gelegentlich verloren: bis zu dreimal versuchen.
      - retry:
          maxRetries: 2
          commands:
            - tapOn: "E-Mail"
            - waitForAnimationToEnd
            - eraseText
            - inputText: admin@e2e.test
            - tapOn: "Passwort"
            - waitForAnimationToEnd
            - eraseText
            - inputText: flutlicht-an
            - pressKey: Enter
            # iOS fragt nach dem Anmelden „Passwort sichern?“ (Wortlaut je nach Version).
            - extendedWaitUntil:
                visible: "Später|Not Now|Nicht jetzt"
                timeout: 5000
                optional: true
            - tapOn:
                text: "Später|Nicht jetzt|Not Now|Niemals für diese Website|Nie für diese Website|Never for This Website"
                optional: true
            - extendedWaitUntil:
                visible: "Fixiert in.*|Nächste fixiert in.*|Gewertet ab.*"
                timeout: 20000
- extendedWaitUntil:
    visible: "Fixiert in.*|Nächste fixiert in.*|Gewertet ab.*"
    timeout: 60000
- takeScreenshot: team
- openLink: ${BASE}/markt
- extendedWaitUntil:
    visible: "Transfermarkt|Dein Kader"
    timeout: 30000
- takeScreenshot: markt
- openLink: ${BASE}/spieltag
- extendedWaitUntil:
    visible: ".*Spieltag.*"
    timeout: 30000
- takeScreenshot: spieltag
- openLink: ${BASE}/tabelle
- extendedWaitUntil:
    visible: "Managerrunde"
    timeout: 30000
- takeScreenshot: tabelle
- openLink: ${BASE}/historie
- extendedWaitUntil:
    visible: "Historie"
    timeout: 30000
- takeScreenshot: historie
- openLink: ${BASE}/einstellungen
- extendedWaitUntil:
    visible: "Darstellung"
    timeout: 30000
- takeScreenshot: optionen
- tapOn: "Namen ändern"
- waitForAnimationToEnd
- takeScreenshot: optionen-namen
- tapOn: "Abbrechen"
