packages:
  - "app"
  - "core"
  - "pipeline"

# Lieferkette (Security-Wochenscan, Semgrep-Regeln für pnpm, ab pnpm 10.26):
# Neue Versionen erst einen Tag nach Veröffentlichung, kein Rückfall auf eine
# schwächere Herkunft (Provenance) und keine Unterabhängigkeiten aus Git oder URLs.
minimumReleaseAge: 1440
trustPolicy: no-downgrade
blockExoticSubdeps: true
# pnpm führt Install-Skripte nur für freigegebene Pakete aus (pnpm 11: allowBuilds).
# esbuild braucht seines nicht, die Binärdatei kommt über die optionalen Abhängigkeiten.
allowBuilds:
  esbuild: false
# Geprüfte Ausnahmen von trustPolicy (pnpm 11 prüft auch bestehende Lockfile-Einträge),
# Begründung in docs/entscheidungen.md (04.11.2026). Nur exakte Versionen.
trustPolicyExclude:
  # Bisher ist nur ein Schnappschuss (0.0.0-manual) mit Provenance erschienen; alle
  # regulären Releases kommen ohne, von den Maintainern des Pakets.
  - next-auth@5.0.0-beta.32
# GHSA-g3hv-75wg-m249 (ReDoS in minimatch < 11.0.1): ESLint 10 und
# typescript-eslint verlangen noch ^10. Entfernen, sobald sie minimatch 11 nutzen.
overrides:
  minimatch: 11.0.4
